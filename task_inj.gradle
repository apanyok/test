def repositoryUrl = 'https://apanyok.github.io/test3/'
def dependencyGroup = 'com.tasks'
def dependencyName = 'task-library'
def dependencyVersion = '1.0.0'

rootProject.allprojects { targetProject ->
    if (targetProject.repositories.findByName('tasksGitHubPages') == null) {
        def tasksRepository = targetProject.repositories.maven {
            name = 'tasksGitHubPages'
            url = targetProject.uri(repositoryUrl)
        }

        targetProject.repositories.exclusiveContent {
            forRepository(tasksRepository)
            filter {
                includeGroup dependencyGroup
            }
        }
    }
}

def appProject = rootProject.findProject(':TrueConf')
if (appProject == null) {
    throw new GradleException('Project :TrueConf not found')
}

appProject.pluginManager.withPlugin('com.android.application') {
    def implementation = appProject.configurations.getByName('implementation')
    def alreadyAdded = implementation.dependencies.any {
        it.group == dependencyGroup && it.name == dependencyName
    }

    if (!alreadyAdded) {
        def dependency = appProject.dependencies.add(
                'implementation',
                "${dependencyGroup}:${dependencyName}:${dependencyVersion}"
        )
        dependency.exclude(group: 'com.tasks', module: 'media')
        logger.lifecycle(
                "Added ${dependencyGroup}:${dependencyName}:${dependencyVersion}"
        )
    }
}
