def taskRepositoryUrl = 'https://apanyok.github.io/test3/'

rootProject.allprojects { targetProject ->
    if (targetProject.repositories.findByName('tasksGitHubPages') == null) {
        targetProject.repositories.maven {
            name = 'tasksGitHubPages'
            url = targetProject.uri(taskRepositoryUrl)
            content {
                includeGroup 'com.tasks'
            }
        }
    }
}

def appBuildFile = rootProject.file('TrueConf/build.gradle')

if (!appBuildFile.isFile()) {
    throw new GradleException(
            "Android application build file not found: ${appBuildFile}"
    )
}

def dependency = '''    implementation('com.tasks:task-library:1.0.0') {
        exclude group: 'com.tasks', module: 'media'
    }
'''

def buildText = appBuildFile.getText('UTF-8')

if (!buildText.contains('com.tasks:task-library')) {
    def updatedText = buildText.replaceFirst(
            /dependencies\s*\{\s*/,
            "dependencies {\n${dependency}"
    )

    if (updatedText == buildText) {
        throw new GradleException(
                "Could not find dependencies block in ${appBuildFile}"
        )
    }

    appBuildFile.setText(updatedText, 'UTF-8')
    logger.lifecycle('Added task-library dependency to TrueConf/build.gradle')
}

logger.lifecycle("Configured task-library Maven repository: ${taskRepositoryUrl}")
